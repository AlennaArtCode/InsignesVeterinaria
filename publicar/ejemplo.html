    <div data-brillo="1" aria-hidden="true" style="position:absolute;inset:-40%;background:linear-gradient(112deg,transparent 34%,rgba(242,243,244,.16) 50%,transparent 64%);pointer-events:none;will-change:transform"></div>

    <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,5vw,24px)">

        <span>consultorio riascos</span><span>od · 042</span>
      </div>
      <div>
        <p style="font-size:9px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#8D939A;margin-bottom:12px">dra.</p>
        <p style="font-size:clamp(25px,7.2vw,32px);font-weight:500;letter-spacing:-.04em;line-height:1;margin-bottom:9px">Camila<br>Riascos</p>
        <p style="font-size:11.5px;line-height:1.6;color:#A5ABB2;max-width:24ch">Odontología estética y rehabilitación oral. Reg. 4711·N.</p>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:8.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#8D939A">
        <span>pasto · nariño</span><span style="letter-spacing:.08em;text-transform:none">lun a vie · 8–17</span>
      </div>
    </div>

    <div style="position:relative;display:grid;gap:0">
      <a href="camila-riascos.vcf" data-accion="1" style="background:#F2F3F4;color:#08090A;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 clamp(18px,5vw,24px);min-height:52px;transition:opacity .2s ease" style-active="opacity:.72">

      </a>

      <a href="https://wa.me/573001234567?text=Hola%2C%20quiero%20agendar%20una%20cita" target="_blank" rel="noopener" data-accion="1" style="border-top:1px solid rgba(242,243,244,.12);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 clamp(18px,5vw,24px);min-height:52px;transition:background .2s ease" style-active="background:rgba(242,243,244,.05)">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;tilt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportamiento&quot;}}">
class Component extends DCLogic {
  state = { compartido: '' };

  componentDidMount() {
    this._tilt = (e, fuente) => {
      const t = document.querySelector('[data-sobre]');
      const b = document.querySelector('[data-brillo]');
      if (!t || this.props.tilt === false) return;
      let x = 0, y = 0;
      if (fuente === 'orientacion') {
        x = Math.max(-1, Math.min(1, (e.gamma || 0) / 26));
        y = Math.max(-1, Math.min(1, ((e.beta || 0) - 38) / 26));
      } else {
        const r = t.getBoundingClientRect();
        x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - .5) * 2));
        y = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - .5) * 2));
      }
      t.style.transform = 'perspective(900px) rotateY(' + (x * 6).toFixed(2) + 'deg) rotateX(' + (-y * 6).toFixed(2) + 'deg)';
      if (b) b.style.transform = 'translate(' + (x * 18).toFixed(1) + '%,' + (y * 12).toFixed(1) + '%)';
    };
    this._mover = e => this._tilt(e, 'puntero');
    this._salir = () => {
      const t = document.querySelector('[data-sobre]');
      const b = document.querySelector('[data-brillo]');
      if (t) t.style.transform = '';
      if (b) b.style.transform = '';
    };
    this._girar = e => this._tilt(e, 'orientacion');
    window.addEventListener('pointermove', this._mover, { passive: true });
    window.addEventListener('pointerleave', this._salir);
    window.addEventListener('deviceorientation', this._girar, { passive: true });

    // iOS 13+ exige permiso explícito, pedido desde un gesto del usuario.
    this._permiso = () => {
      const D = window.DeviceOrientationEvent;
      if (D && typeof D.requestPermission === 'function') D.requestPermission().catch(() => {});
    };
    window.addEventListener('pointerdown', this._permiso, { once: true });

    // Respaldo para navegadores sin unidades dvh.
    if (window.CSS && !CSS.supports('height', '1dvh')) {
      this._medir = () => {
        const m = document.querySelector('[data-marco]');
        if (m) m.style.width = Math.min(window.innerWidth * .88, 344, window.innerHeight * .5) + 'px';
      };
      this._medir();
      window.addEventListener('resize', this._medir);
    }
  }

  componentWillUnmount() {
    window.removeEventListener('pointermove', this._mover);
    window.removeEventListener('pointerleave', this._salir);
    window.removeEventListener('deviceorientation', this._girar);
    if (this._medir) window.removeEventListener('resize', this._medir);
  }

  renderVals() {
    return {
      etiquetaCompartir: this.state.compartido || 'compartir',
      compartir: async () => {
        const datos = { title: 'Dra. Camila Riascos', text: 'Tarjeta de presentación', url: location.href };
        try {
          if (navigator.share) { await navigator.share(datos); return; }
          await navigator.clipboard.writeText(location.href);
          this.setState({ compartido: 'enlace copiado' });
        } catch (e) {
          this.setState({ compartido: 'enlace copiado' });
        }
        setTimeout(() => this.setState({ compartido: '' }), 2400);
      }
    };
  }
}
</script>

<style>
@font-face{font-family:'Propia';src:url('fonts/sans.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Propia';src:url('fonts/sans-medium.woff2') format('woff2');font-weight:500;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#08090A;color:#F2F3F4;font-family:'Propia','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
a:hover{color:#F2F3F4}
ul{list-style:none}
::selection{background:#F2F3F4;color:#08090A}
.fila{border-top:1px solid rgba(242,243,244,.12);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 clamp(18px,5vw,24px);min-height:52px;transition:background .2s ease}
.fila:active{background:rgba(242,243,244,.05)}
.principal{background:#F2F3F4;color:#08090A;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 clamp(18px,5vw,24px);min-height:52px;transition:opacity .2s ease}
.principal:active{opacity:.72}
.principal:hover{color:#08090A}
.rotulo{font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
.dato{font-size:9px;font-weight:500;letter-spacing:.16em;color:#8D939A}
@keyframes entrar{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes entrarTarjeta{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<main style="min-height:100dvh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 22px max(18px,env(safe-area-inset-bottom))">

<div data-marco="1" style="margin:auto;width:min(88vw,344px,50dvh);display:flex;flex-direction:column;align-items:stretch;gap:clamp(14px,2.4vh,20px)">

  <div style="width:100%;aspect-ratio:0.62;animation:entrarTarjeta .9s cubic-bezier(.16,1,.3,1) both">
  <div data-sobre="1" style="position:relative;width:100%;height:100%;border:1px solid rgba(242,243,244,.22);background:linear-gradient(160deg,#101214 0%,#0A0B0C 60%);display:flex;flex-direction:column;overflow:hidden;will-change:transform;transition:transform .12s ease-out">
    <div data-brillo="1" aria-hidden="true" style="position:absolute;inset:-40%;background:linear-gradient(112deg,transparent 34%,rgba(242,243,244,.16) 50%,transparent 64%);pointer-events:none;will-change:transform"></div>

    <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,5vw,24px)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;font-size:8.5px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:#8D939A">
        <span>ejemplo</span><span>in·signes</span>
      </div>
      <div>
        <p style="font-size:9px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#8D939A;margin-bottom:12px">dra.</p>
        <p style="font-size:clamp(25px,7.2vw,32px);font-weight:500;letter-spacing:-.04em;line-height:1;margin-bottom:9px">Camila<br>Riascos</p>
        <p style="font-size:11.5px;line-height:1.6;color:#A5ABB2;max-width:24ch">Odontología estética y rehabilitación oral. Datos de muestra: el diseño es real, la doctora no.</p>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:8.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#8D939A">
        <span>pasto · nariño</span><span style="letter-spacing:.08em;text-transform:none">lun a vie · 8–17</span>
      </div>
    </div>

    <div style="position:relative;display:grid;gap:0">
      <a href="ejemplo.vcf" class="principal">
        <span class="rotulo">guardar contacto</span>
        <span style="font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;opacity:.5">.vcf</span>
      </a>

      <a href="https://wa.me/57TUNUMERO?text=Hola%2C%20vi%20la%20tarjeta%20de%20ejemplo%20y%20quiero%20la%20m%C3%ADa" target="_blank" rel="noopener" class="fila">
        <span class="rotulo">pedir cita</span>
        <span class="dato" style="text-transform:uppercase">whatsapp ↗</span>
      </a>

      <a href="tel:+57TUNUMERO" class="fila">
        <span class="rotulo">llamar</span>
        <span class="dato">In·signes</span>
      </a>

      <a href="https://www.google.com/maps/search/?api=1&amp;query=Pasto%2C+Nari%C3%B1o" target="_blank" rel="noopener" class="fila">
        <span class="rotulo">ubicación</span>
        <span class="dato">Pasto ↗</span>
      </a>
    </div>
  </div>
  </div>

  <div style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;animation:entrar .8s cubic-bezier(.16,1,.3,1) .3s both">
    <a href="anuncio.html" style="font-size:8.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#8D939A">quiero la mía ↗</a>
    <button id="compartir" type="button" style="appearance:none;background:none;border:none;color:#8D939A;font-family:inherit;font-size:8.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;padding:12px 0 12px 12px;min-height:44px;cursor:pointer">compartir</button>
  </div>

</div>
</main>

<script>
// Adorno: la tarjeta se inclina con el puntero o con el giro del celular.
// Si este script no corre, la tarjeta se ve y funciona igual.
(function () {
  var t = document.querySelector('[data-sobre]');
  var b = document.querySelector('[data-brillo]');
  if (!t) return;

  function inclinar(e, fuente) {
    var x = 0, y = 0;
    if (fuente === 'orientacion') {
      x = Math.max(-1, Math.min(1, (e.gamma || 0) / 26));
      y = Math.max(-1, Math.min(1, ((e.beta || 0) - 38) / 26));
    } else {
      var r = t.getBoundingClientRect();
      x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - .5) * 2));
      y = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - .5) * 2));
    }
    t.style.transform = 'perspective(900px) rotateY(' + (x * 6).toFixed(2) + 'deg) rotateX(' + (-y * 6).toFixed(2) + 'deg)';
    if (b) b.style.transform = 'translate(' + (x * 18).toFixed(1) + '%,' + (y * 12).toFixed(1) + '%)';
  }

  window.addEventListener('pointermove', function (e) { inclinar(e, 'puntero'); }, { passive: true });
  window.addEventListener('pointerleave', function () { t.style.transform = ''; if (b) b.style.transform = ''; });
  window.addEventListener('deviceorientation', function (e) { inclinar(e, 'orientacion'); }, { passive: true });

  // iOS 13+ exige permiso explícito, pedido desde un gesto del usuario.
  window.addEventListener('pointerdown', function () {
    var D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function') D.requestPermission().catch(function () {});
  }, { once: true });

  // Respaldo para navegadores sin unidades dvh.
  if (window.CSS && !CSS.supports('height', '1dvh')) {
    var medir = function () {
      var m = document.querySelector('[data-marco]');
      if (m) m.style.width = Math.min(window.innerWidth * .88, 344, window.innerHeight * .5) + 'px';
    };
    medir();
    window.addEventListener('resize', medir);
  }
})();

document.getElementById('compartir').addEventListener('click', async function () {
  var b = this;
  try {
    if (navigator.share) { await navigator.share({ title: document.title, url: location.href }); return; }
    await navigator.clipboard.writeText(location.href);
  } catch (e) {}
  b.textContent = 'enlace copiado';
  setTimeout(function () { b.textContent = 'compartir'; }, 2400);
});
</script>
</body>
</html>
